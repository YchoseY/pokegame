<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>戳戳樂 (皮克敏拔草探險版)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="data.js"></script>
    <style>
        /* --- 全局設定 (森林草地風) --- */
        body {
            font-family: "Arial Rounded MT Bold", "Comic Sans MS", "微軟正黑體", sans-serif;
            background: #E8F5E9; /* 淺草綠底色 */
            background-image: radial-gradient(#C8E6C9 2px, transparent 2px); /* 深一點的綠色點點 */
            background-size: 25px 25px;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 設定按鈕 (森林綠) --- */
        .settings-trigger {
            position: absolute; top: 10px; left: 10px;
            font-size: 1.5rem; opacity: 0.6; cursor: pointer;
            background: rgba(255,255,255,0.7); padding: 5px; border-radius: 50%;
            border: 2px solid #4CAF50; z-index: 200; color: #4CAF50;
        }
        .settings-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #FFF; padding: 20px; width: 85%; max-width: 400px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid #4CAF50; z-index: 201; text-align: center;
        }
        .settings-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200;
        }
        textarea { width: 100%; height: 100px; padding: 10px; border: 2px solid #A5D6A7; resize: none; border-radius: 10px; outline: none;}
        .btn { padding: 10px 20px; border-radius: 25px; border: none; cursor: pointer; color: white; margin-top: 10px; width: 100%; font-size: 1rem; font-weight: bold; }
        .btn-green { background: #4CAF50; box-shadow: 0 4px #388E3C; }
        .btn-red { background: #FF7043; box-shadow: 0 4px #E64A19; }
        .btn:active { transform: translateY(2px); box-shadow: none; }

        /* --- 戳戳樂盒子主體 (泥土大地風) --- */
        .game-container {
            flex: 1;
            display: flex; justify-content: center; align-items: center;
            width: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }

        .poke-box {
            background: #8D6E63; /* 泥土的褐色 */
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(93, 64, 55, 0.5), inset 0 -5px 20px rgba(0,0,0,0.2);
            border: 3px solid #5D4037; /* 深咖啡色邊框 */
            display: grid;
            gap: 12px;
            max-width: 95%; max-height: 80vh; overflow-y: auto;
        }

        /* --- 單個洞洞 (深邃的地洞) --- */
        .hole {
            width: 75px; height: 75px;
            position: relative;
            cursor: pointer;
            border-radius: 50%;
            background: #3E2723; /* 洞裡深泥土色 */
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            overflow: visible; 
        }

        /* 覆蓋的棉紙 (圖片層) */
        .paper-cover {
            position: absolute; top: -4px; left: -4px;
            width: 83px; height: 83px;
            border-radius: 50%;
            background-color: #fff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid #EFEBE9; /* 淺色紙張邊緣 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            z-index: 2;
            filter: contrast(1.05) brightness(1.02);
        }
        
        .hole:not(.poked):hover .paper-cover { transform: scale(1.08); }
        .hole:not(.poked):active .paper-cover { transform: scale(0.95); filter: brightness(0.9); }

        .hole.poked .paper-cover { pointer-events: none; }
        
        .burst-anim { animation: violentBurst 0.35s forwards ease-out; }

        @keyframes violentBurst {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            15% { transform: scale(0.9); }
            50% { transform: scale(1.6) rotate(-15deg); opacity: 0.8; }
            100% { transform: scale(2.2) rotate(10deg); opacity: 0; }
        }

        /* --- 彈跳出來的獎項 (大自然清新風) --- */
        .prize-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 300;
            justify-content: center; align-items: center;
            flex-direction: column;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .prize-card {
            background: #fff; padding: 40px; border-radius: 30px;
            text-align: center; border: 6px solid #4CAF50;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.4);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 85%;
        }
        @keyframes popUp { from { transform: scale(0) rotate(-10deg); } to { transform: scale(1) rotate(0deg); } }

        .prize-name { font-size: 3rem; font-weight: 900; color: #2E7D32; margin-bottom: 25px; text-shadow: 2px 2px 0 #E8F5E9; }
        .close-btn { background: linear-gradient(to bottom, #66BB6A, #43A047); color: white; border: none; padding: 15px 40px; font-size: 1.3rem; border-radius: 40px; cursor: pointer; font-weight: bold; box-shadow: 0 5px #2E7D32; }
        .close-btn:active { transform: translateY(3px); box-shadow: 0 2px #2E7D32; }

        /* --- 底部庫存清單 (草地風) --- */
        .inventory-panel {
            width: 90%; max-width: 600px;
            background: rgba(255,255,255,0.95); border-radius: 20px 20px 0 0;
            border: 3px solid #81C784; border-bottom: none;
            padding: 15px; max-height: 20vh; overflow-y: auto;
            box-shadow: 0 -5px 15px rgba(129, 199, 132, 0.3); z-index: 50;
        }
        .inventory-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .inv-item {
            background: #fff; border: 2px solid #A5D6A7; border-radius: 20px;
            padding: 5px 12px; font-size: 0.9rem; color: #555; font-weight: bold;
        }
        .inv-item.empty { background: #f5f5f5; color: #bbb; border-color:#eee; text-decoration: line-through; }
        .inv-badge { background: #4CAF50; color: white; border-radius: 50%; padding: 3px 8px; font-size: 0.8rem; margin-left: 6px; }

        @media (max-width: 600px) {
            .hole { width: 65px; height: 65px; }
            .paper-cover { width: 73px; height: 73px; }
            .prize-name { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <button class="settings-trigger" onclick="toggleSettings()">⚙️</button>

    <div class="settings-backdrop" id="backdrop" onclick="toggleSettings()"></div>
    <div class="settings-modal" id="settingsModal">
        <h3 style="color:#2E7D32">🌱 探險設定</h3>
        <p style="font-size:0.8rem; color:#4CAF50">輸入：獎項,數量 (總數決定地洞數)</p>
        <textarea id="prizeInput"></textarea>
        <button class="btn btn-green" onclick="saveConfigOnly()">暫存設定</button>
        <button class="btn btn-red" onclick="resetPool()">♻️ 重置 (產生新草地)</button>
    </div>

    <div class="game-container">
        <div id="pokeBox" class="poke-box"></div>
    </div>

    <div class="prize-modal" id="prizeModal" onclick="closeModal()">
        <div class="prize-card" onclick="event.stopPropagation()">
            <div style="font-size: 4rem; margin-bottom: 10px;">🎁</div>
            <div id="modalPrizeName" class="prize-name">獎項名稱</div>
            <button class="close-btn" onclick="closeModal()">太棒了！</button>
        </div>
    </div>

    <div class="inventory-panel">
        <div style="text-align:center; font-weight:bold; color:#388E3C; margin-bottom:8px;">🍃 尚未挖出的寶物 🍃</div>
        <div id="inventoryList" class="inventory-list"></div>
    </div>

    <!-- 音效已經替換成清脆好聽的版本 -->
    <!-- 撕開包裝紙的音效 -->
    <audio id="s_pop" src="https://assets.mixkit.co/active_storage/sfx/3005/3005-preview.mp3"></audio>
    
    <!-- 小群眾鼓掌歡呼聲 -->
    <audio id="s_cheer" src="https://assets.mixkit.co/active_storage/sfx/518/518-preview.mp3"></audio>

    <script>
        var pokeBox = document.getElementById('pokeBox');
        var inventoryList = document.getElementById('inventoryList');
        var inputArea = document.getElementById('prizeInput');
        var prizeModal = document.getElementById('prizeModal');
        var modalPrizeName = document.getElementById('modalPrizeName');

        var currentTickets = []; 
        var totalHoles = 0;      
        var pokedState = [];     

        // =================================================================
        // 放入你上傳到 GitHub 的 8 隻皮克敏圖片
        // =================================================================
        var coverImages = [
            'blue.png',
            'purple.png',
            'rock.png',
            'white.png',
            'winged.png',
            'yellow.png'
        ];
        // =================================================================
        // 如果還沒準備好圖片，可以暫時用這個預設的葉子圖：
        // var coverImages = ['https://cdn-icons-png.flaticon.com/512/2990/2990861.png'];
        // =================================================================

        function initGame() {
            var savedTickets = localStorage.getItem('poke_tickets_v3');
            var savedConfig = localStorage.getItem('poke_config_v3');
            var savedState = localStorage.getItem('poke_state_v3');

            if(savedConfig) {
                inputArea.value = savedConfig;
            } else if (typeof myPrizeData !== 'undefined') {
                inputArea.value = myPrizeData.trim();
            } else {
                inputArea.value = "紅色皮克敏玩偶,1\n皮克敏貼紙,5\n水果軟糖,14";
            }

            if (savedTickets && savedState) {
                currentTickets = JSON.parse(savedTickets);
                pokedState = JSON.parse(savedState);
                totalHoles = pokedState.length;
                renderBox();
            } else {
                buildPoolFromInput();
            }
            updateInventoryUI();
        }

        function buildPoolFromInput() {
            var rawText = inputArea.value.trim();
            localStorage.setItem('poke_config_v3', rawText);
            
            var lines = rawText.split('\n').filter(l => l.trim() !== '');
            currentTickets = [];
            
            lines.forEach(line => {
                var parts = line.replace('，', ',').split(',');
                var name = parts[0].trim();
                var count = parseInt(parts[1]) || 1;
                for(var i=0; i < count; i++) currentTickets.push(name);
            });

            totalHoles = currentTickets.length;
            pokedState = new Array(totalHoles).fill(false);
            
            saveData();
            renderBox();
        }

        function saveData() {
            localStorage.setItem('poke_tickets_v3', JSON.stringify(currentTickets));
            localStorage.setItem('poke_state_v3', JSON.stringify(pokedState));
        }

        function renderBox() {
            pokeBox.innerHTML = '';
            
            var columns = 4;
            if (totalHoles <= 6) columns = 2;
            else if (totalHoles <= 12) columns = 3;
            else if (totalHoles <= 20) columns = 4;
            else columns = 5;
            
            if (window.innerWidth < 500) columns = Math.min(columns, 4);

            pokeBox.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

            for(let i=0; i<totalHoles; i++) {
                let hole = document.createElement('div');
                hole.className = 'hole';
                
                if (pokedState[i]) {
                    hole.classList.add('poked');
                } else {
                    let paper = document.createElement('div');
                    paper.className = 'paper-cover';
                    paper.style.backgroundImage = `url('${coverImages[i % coverImages.length]}')`;
                    paper.onclick = function() { pokeHole(i, paper); };
                    hole.appendChild(paper);
                }
                pokeBox.appendChild(hole);
            }
        }

        function pokeHole(index, paperElement) {
            if (currentTickets.length === 0) {
                alert("寶物都挖完囉！");
                return;
            }

            var s_pop = document.getElementById('s_pop');
            try { s_pop.currentTime = 0; s_pop.play(); } catch(e){}

            paperElement.classList.add('burst-anim');
            setTimeout(() => { paperElement.remove(); }, 350);

            pokedState[index] = true;
            document.querySelectorAll('.hole')[index].classList.add('poked');

            var ticketIndex = Math.floor(Math.random() * currentTickets.length);
            var result = currentTickets[ticketIndex];
            currentTickets.splice(ticketIndex, 1);

            saveData();
            updateInventoryUI();

            setTimeout(() => {
                showPrize(result);
            }, 300);
        }

        function showPrize(name) {
            var s_cheer = document.getElementById('s_cheer');
            try { s_cheer.currentTime = 0; s_cheer.play(); } catch(e){}
            
            modalPrizeName.innerText = name;
            prizeModal.style.display = 'flex';
            // 碎紙花改成綠色與黃色系
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 }, colors: ['#4CAF50', '#8BC34A', '#FFEB3B'] });
        }

        function closeModal() {
            prizeModal.style.display = 'none';
            // 停止音效的程式碼已經加在這裡了！
            var s_cheer = document.getElementById('s_cheer');
            try {
                s_cheer.pause();
                s_cheer.currentTime = 0;
            } catch(e){}
        }

        function updateInventoryUI() {
            var counts = {};
            var rawText = inputArea.value.trim();
            var lines = rawText.split('\n').filter(l => l.trim() !== '');
            var allNames = [];
            lines.forEach(line => {
                var parts = line.replace('，', ',').split(',');
                var name = parts[0].trim();
                if(!allNames.includes(name)) allNames.push(name);
                counts[name] = 0;
            });
            currentTickets.forEach(item => { if(counts[item] !== undefined) counts[item]++; });

            inventoryList.innerHTML = '';
            allNames.forEach(name => {
                var count = counts[name];
                var div = document.createElement('div');
                div.className = 'inv-item' + (count === 0 ? ' empty' : '');
                div.innerHTML = `${name} <span class="inv-badge">${count}</span>`;
                inventoryList.appendChild(div);
            });
        }

        function toggleSettings() {
            var m = document.getElementById('settingsModal');
            var b = document.getElementById('backdrop');
            var show = m.style.display === 'block';
            m.style.display = show ? 'none' : 'block';
            b.style.display = show ? 'none' : 'block';
        }

        function saveConfigOnly() {
            localStorage.setItem('poke_config_v3', inputArea.value);
            toggleSettings();
            alert("設定已暫存，請按「重置」生效");
        }

        function resetPool() {
            if(confirm("要換一片新草地嗎？所有地洞都會補滿寶物喔！")) {
                localStorage.removeItem('poke_tickets_v3');
                localStorage.removeItem('poke_state_v3');
                buildPoolFromInput();
                updateInventoryUI();
                toggleSettings();
            }
        }

        initGame();
    </script>
</body>
</html>
